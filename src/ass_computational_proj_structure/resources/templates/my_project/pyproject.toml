[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "{project_name}"
version = "{version}"
license = "MIT"
description = ""
requires-python = ">=3.11"
dependencies = [
    "loguru",
]

[tool.setuptools.packages.find]
where = ["src"]
